services:
  camui:
    build: .
    privileged: true                      # Required for /dev/video* camera access
    network_mode: host                    # Allows LAN access without port mapping
    volumes:
      - /run/udev:/run/udev:ro            # udev events for camera detection
      - ./data:/app/data                  # Persist gallery + profiles on the host
    environment:
      - CAMUI_DATA_DIR=/app/data          # Tell camui where to store runtime data
    restart: unless-stopped

# CamUI — Pixi workspace & package configuration
# https://pixi.sh

[workspace]
name = "camui"
version = "2.0.0b0"
description = "Lightweight web interface for Raspberry Pi camera modules, built on picamera2 and Flask"
authors = ["James Mitchell"]
channels = ["conda-forge"]
platforms = ["linux-aarch64", "linux-64"]

[dependencies]
python = ">=3.10"
flask = ">=3.0"
pillow = ">=10.0"
picamera2 = ">=0.3.36"

[pypi-dependencies]
camui = { path = ".", editable = true }

[tasks]
dev = "python -m camui --ip 0.0.0.0 --port 8080"
dev-port = { cmd = "python -m camui --ip 0.0.0.0 --port $PORT", env = { PORT = "8080" } }
diagnostics = "python -m camui.diagnostics"
